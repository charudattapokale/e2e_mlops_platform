<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img" aria-labelledby="ttl dsc">
<title id="ttl">MLOps platform architecture</title>
<desc id="dsc">GitHub feeds Jenkins. The Jenkins agent pushes images to the local registry, applies the training Job and deploys the inference API. The training Job logs runs and models to MLflow, which notifies the inference API by webhook when the champion alias changes. A client reaches the API through Traefik.</desc>
<style>
  text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .h{font-size:14px;font-weight:500}
  .s{font-size:12px}
  .m{text-anchor:middle;dominant-baseline:central}
  .g{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.8}
  .tl{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.8}
  .pu{fill:#EEEDFE;stroke:#534AB7;stroke-width:.8}
  .c{fill:none;stroke:#888780;stroke-width:.8;stroke-dasharray:4 4}
  .hg{fill:#2C2C2A}.sg{fill:#5F5E5A}
  .ht{fill:#04342C}.st{fill:#0F6E56}
  .hp{fill:#26215C}.sp{fill:#534AB7}
  .a{fill:none;stroke:#5F5E5A;stroke-width:1.5}
  .d{stroke-dasharray:4 4}
</style>
<rect width="680" height="580" fill="#FFFFFF"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="g" x="35" y="24" width="190" height="48" rx="8"/>
<text class="h hg m" x="130" y="40">GitHub</text>
<text class="s sg m" x="130" y="58">code and Jenkinsfiles</text>

<rect class="c" x="30" y="96" width="200" height="150" rx="12"/>
<text class="s sg" x="46" y="112">ci</text>
<rect class="tl" x="50" y="122" width="160" height="44" rx="8"/>
<text class="h ht m" x="130" y="137">Jenkins</text>
<text class="s st m" x="130" y="153">jobs defined as code</text>
<rect class="tl" x="50" y="190" width="160" height="46" rx="8"/>
<text class="h ht m" x="130" y="205">Agent pod</text>
<text class="s st m" x="130" y="222">Kaniko and kubectl</text>

<rect class="tl" x="35" y="320" width="190" height="48" rx="8"/>
<text class="h ht m" x="130" y="336">Local registry</text>
<text class="s st m" x="130" y="354">images for Jobs and API</text>

<rect class="g" x="480" y="24" width="170" height="48" rx="8"/>
<text class="h hg m" x="565" y="40">Client</text>
<text class="s sg m" x="565" y="58">api.localhost:8081</text>

<rect class="g" x="480" y="122" width="170" height="44" rx="8"/>
<text class="h hg m" x="565" y="137">Traefik</text>
<text class="s sg m" x="565" y="153">ingress, path allow-list</text>

<rect class="c" x="260" y="300" width="180" height="90" rx="12"/>
<text class="s sg" x="276" y="318">training</text>
<rect class="pu" x="275" y="328" width="150" height="48" rx="8"/>
<text class="h hp m" x="350" y="344">Training Job</text>
<text class="s sp m" x="350" y="362">one per build</text>

<rect class="c" x="470" y="300" width="180" height="90" rx="12"/>
<text class="s sg" x="486" y="318">serving</text>
<rect class="pu" x="485" y="328" width="150" height="48" rx="8"/>
<text class="h hp m" x="560" y="344">Inference API</text>
<text class="s sp m" x="560" y="362">loads the champion</text>

<rect class="c" x="260" y="420" width="390" height="100" rx="12"/>
<text class="s sg" x="276" y="438">mlops</text>
<rect class="tl" x="275" y="450" width="180" height="48" rx="8"/>
<text class="h ht m" x="365" y="466">MLflow</text>
<text class="s st m" x="365" y="484">runs, models, registry</text>
<rect class="tl" x="490" y="450" width="145" height="48" rx="8"/>
<text class="h ht m" x="562" y="466">PostgreSQL</text>
<text class="s st m" x="562" y="484">metadata, webhooks</text>

<line class="a" x1="130" y1="72" x2="130" y2="118" marker-end="url(#ar)"/>
<line class="a" x1="130" y1="166" x2="130" y2="186" marker-end="url(#ar)"/>
<line class="a" x1="130" y1="236" x2="130" y2="316" marker-end="url(#ar)"/>
<path class="a" d="M210 213 H350 V296" marker-end="url(#ar)"/>
<path class="a" d="M350 213 H520 V296" marker-end="url(#ar)"/>
<line class="a" x1="565" y1="72" x2="565" y2="118" marker-end="url(#ar)"/>
<line class="a" x1="565" y1="166" x2="565" y2="296" marker-end="url(#ar)"/>
<line class="a" x1="350" y1="390" x2="350" y2="446" marker-end="url(#ar)"/>
<line class="a" x1="455" y1="474" x2="486" y2="474" marker-end="url(#ar)"/>
<path class="a d" d="M430 450 V412 H540 V394" marker-end="url(#ar)"/>
<text class="s sg" x="452" y="406">webhook</text>

<rect class="tl" x="30" y="548" width="14" height="14" rx="3"/>
<text class="s sg" x="52" y="559">Platform services</text>
<rect class="pu" x="200" y="548" width="14" height="14" rx="3"/>
<text class="s sg" x="222" y="559">Built by the pipelines</text>
<rect class="g" x="400" y="548" width="14" height="14" rx="3"/>
<text class="s sg" x="422" y="559">External or built in</text>
</svg>
