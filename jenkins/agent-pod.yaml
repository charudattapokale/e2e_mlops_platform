apiVersion: v1
kind: Pod
spec:
  serviceAccountName: jenkins-agent
  containers:
    - name: kaniko
      image: gcr.io/kaniko-project/executor:debug
      command: ["sleep"]
      args: ["infinity"]
      resources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {memory: 3Gi}
    - name: kubectl
      image: alpine/k8s:1.33.0
      command: ["sleep"]
      args: ["infinity"]
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 512Mi}
